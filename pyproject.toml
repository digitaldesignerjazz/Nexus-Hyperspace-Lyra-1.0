[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-hyperspace-lyra"
version = "1.0.0"
description = "Nexus-Hyperspace-Lyra-1.0 — Decentralized, intelligent, resonant hyperspace networking with emotional AI swarm modulation for the Nexus / NovaNet ecosystem."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sven Normen Esslinger / Esslinger & Co." }
]
requires-python = ">=3.11"
keywords = [
    "hyperspace", "mesh-network", "yggdrasil", "nexus", "lyra", "ai-agents",
    "swarm-intelligence", "decentralized", "emotional-ai", "resonance",
    "constellation", "nova-net", "qnet"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]

dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "PyNaCl>=1.5",
    "rich>=13.0",           # beautiful terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/digitaldesignerjazz/Nexus-Hyperspace-Lyra-1.0"
Repository = "https://github.com/digitaldesignerjazz/Nexus-Hyperspace-Lyra-1.0"
Issues = "https://github.com/digitaldesignerjazz/Nexus-Hyperspace-Lyra-1.0/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
